name: Generate Stats Cards

on:
  schedule:
    - cron: "30 2 * * *"      # daily at 02:30 UTC
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  cards:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # optional: swap for a PAT secret to include private contributions
          GH_USER: ${{ github.repository_owner }}
          OUT_DIR: assets
        run: python3 .github/scripts/gen_cards.py

      - name: Commit updated cards
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/top-langs.svg assets/streak.svg
          git diff --quiet --cached || git commit -m "Update stats cards [skip ci]"
          git push
